<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="dashboard-header">
        <h1>Online Voting System</h1>
        <div>
            <span id="welcome">Welcome!</span>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        <section>
            <h2>Available Elections</h2>
            <p>Choose an election to view its candidates.</p>

            <p id="electionMessage" class="message"></p>
            <div id="elections" class="election-grid"></div>
        </section>

        <section id="candidateSection" class="candidate-section" hidden>
            <h2 id="candidateHeading">Candidates</h2>
            <p id="candidateMessage" class="message"></p>
            <div id="candidates" class="candidate-grid"></div>

            <button id="confirmVoteBtn" hidden>
                Confirm Vote
            </button>

            <p id="voteMessage" class="message" role="status"></p>
        </section>


        <section id="resultsSection" class="results-section">
            <h2>Election Results</h2>
            <p>Select an election to view its results.</p>

            <div id="resultsElectionList" class="election-grid"></div>

            <div id="resultsMessage" class="message" role="status"></div>

            <div id="resultsDashboard" hidden>
                <h3 id="resultsTitle"></h3>
                <p id="totalVotes"></p>

                <div id="resultsList" class="results-list"></div>

                <div class="chart-container">
                    <canvas id="resultsChart" aria-label="Candidate vote counts"></canvas>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
